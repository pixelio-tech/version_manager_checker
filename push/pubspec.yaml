name: version_manager_v3_push
description: >
  Remote push для Version Manager v3 через Firebase Cloud Messaging: токен
  устройства, его обновление и открытие пуша рассылки. Отдельный пакет —
  чтобы приложения без пушей не тянули firebase_messaging.
version: 0.1.0
publish_to: none
homepage: https://github.com/pixelio-tech/version_manager_checker

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  version_manager_v3_checker:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
